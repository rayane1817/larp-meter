[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "larp-meter"
version = "3.0.0"
description = "Audit professional claims against verifiable evidence — a due-diligence triage tool."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["osint", "due-diligence", "verification", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Zero runtime dependencies is a design constraint, not an oversight:
# the tool must run anywhere Python does, with nothing to install.
dependencies = []

[project.urls]
Homepage = "https://github.com/rayane1817/larp-meter"

[project.scripts]
larp-meter = "larp_meter.cli:main"

[tool.setuptools]
packages = ["larp_meter"]
